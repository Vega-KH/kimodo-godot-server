[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kimodo-godot-server"
version = "0.1.0.dev0"
description = "Local Kimodo motion-generation service for the Godot editor, with an MMCP-compatible backbone."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "MMCP contributors" }]
keywords = ["mmcp", "motionmcp", "kimodo", "motion", "animation", "backbone"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

dependencies = [
    "motionmcp-sdk @ git+https://github.com/animatica-ai/motionmcp.git@a298338bb3684a506ec313dce6d5cb12a6dc5167",
    # Temporary Windows/low-VRAM baseline; see ADR 0002.
    "kimodo @ git+https://github.com/animatica-ai/kimodo.git@390fadb57a188fb97b8c3af5d5fb693a72ff03c3",
    "numpy >= 1.24",
    "torch == 2.12.1",
]

[project.optional-dependencies]
dev = [
    "pytest >= 8.0",
    "ruff >= 0.4",
    "uv == 0.12.9",
]

[project.scripts]
# Keep the upstream command while clients and documentation migrate.
kimodo-godot-server = "motionmcp_kimodo.cli:main"
motionmcp-kimodo = "motionmcp_kimodo.cli:main"

[project.urls]
Upstream = "https://github.com/animatica-ai/motionmcp-kimodo"

[tool.hatch.metadata]
allow-direct-references = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.hatch.build.targets.wheel]
packages = ["src/motionmcp_kimodo"]

[tool.hatch.build.targets.sdist]
include = ["src/motionmcp_kimodo", "tests", "docs", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
